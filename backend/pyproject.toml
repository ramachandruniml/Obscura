[project]
name = "obscura-backend"
version = "0.1.0"
description = "Privacy-preserving face redaction API — detection + redaction only, no recognition."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<6",
    "structlog>=24.4",
    "numpy>=1.26,<2.2",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "torch>=2.5,<2.7",
    "torchvision>=0.20,<0.22",
    "ultralytics>=8.3,<8.4",
    # ByteTrack lives in sv.ByteTrack through 0.27; deprecated in 0.28, removed in
    # 0.31 (moved to the separate `trackers` package). Pinned to the stable range.
    "supervision>=0.25,<0.28",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "av>=13.1",
    "imageio-ffmpeg>=0.5.1",
    "tqdm>=4.67",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RET", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
